<!DOCTYPE html>
    <html lang="pt-BR">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, inicial-scale=1.0">
            <title> Configurações </title>
            <link rel="stylesheet" href="style.css">
        </head>
        <body>
            <div class="caixa-login">
                <h2> Configurações </h2>
                <p style="text-align: center; margin-bottom: 20px;"> Ajustes de Acessibilidade</p>

                <button type="button" class="btn-menu" onclick="alternarModoEscuro()"> Modo Escuro (dark) </button>
                <button type="button" class="btn-menu" onclick="alternarFonteGrande()"> Letras Maiores </button>

                <a href="menu.html" class="link-esqueci" style="text-align: center; margin-top: 20px;"> Voltar ao Menu</a>
            </div>

            <script>
                function alternarModoEscuro(){
                    document.body.classList.toggle('modo-escuro');
                }

                function alternarFonteGrande(){
                    document.body.classList.toggle('fonte-grande');
                }
            </script>
        </body>
    </html>
